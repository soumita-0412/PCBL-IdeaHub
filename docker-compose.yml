# ============================================================
# IDEAS PORTAL — docker-compose.yml
# Base orchestration for all services.
# For local dev, override values in docker-compose.override.yml
# ============================================================

version: "3.9"

# ─── Named Volumes ─────────────────────────────────────────
volumes:
  mongo_data:
    driver: local

# ─── Networks ──────────────────────────────────────────────
networks:
  ideas_network:
    driver: bridge

# ─── Services ──────────────────────────────────────────────
services:

  # ── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: ideas_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infrastructure/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ideas_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ideas_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_INITDB_DATABASE}?authSource=admin
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ideas_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend (Next.js) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ideas_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ideas_network
